<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#143B3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="지간3 평가">
<title>지역사회간호학3 평가</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{--pine:#143B3A;--pine2:#1E4E4C;--bg:#F2F5F1;--card:#FFFFFF;--line:#D3DDD8;--ink:#1C2B2A;--muted:#5A6B68;--amber:#D9822B;--amberT:#9A5212;--tint:#FBEAD6;--ok:#2F7D45;--okT:#E3F1E6;--no:#B8342A;--noT:#F8E1DE}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:17px;line-height:1.6;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--pine);color:#F2F5F1;padding:calc(14px + env(safe-area-inset-top)) 20px 14px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px}
header .t{font-weight:800;font-size:18px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:none;border:0;color:#F2F5F1;font-size:15px;font-family:inherit;padding:6px 8px;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:24px;margin:8px 0 4px;line-height:1.35}
h2{font-size:19px;margin:24px 0 10px}
.muted{color:var(--muted);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}
.quiz-item{display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .08s}
.quiz-item:active{transform:scale(.99)}
.badge{min-width:52px;height:52px;border-radius:12px;background:var(--pine);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;text-align:center;line-height:1.1}
.badge.diag{background:var(--amber)}
.qi-body{flex:1;min-width:0}
.qi-title{font-weight:700}
.chip{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--okT);color:var(--ok);font-weight:700}
.chip.todo{background:#EEF1EF;color:var(--muted)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;background:var(--pine);color:#fff}
.btn.sec{background:#fff;color:var(--pine);border:1.5px solid var(--pine)}
.btn.amber{background:var(--amber)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px}.row>*{flex:1}
input{width:100%;font-size:17px;font-family:inherit;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;margin:6px 0 14px}
input:focus{outline:none;border-color:var(--pine)}
label{font-weight:700;font-size:15px}
.progress{height:8px;background:#DDE5E1;border-radius:99px;overflow:hidden;margin:6px 0 18px}
.progress>div{height:100%;background:var(--amber);transition:width .2s}
.qtext{font-size:19px;font-weight:700;line-height:1.55;margin:4px 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px;margin:9px 0;font-size:17px;font-family:inherit;color:var(--ink);cursor:pointer;line-height:1.5}
.opt .n{font-weight:800;color:var(--pine);min-width:22px}
.opt.sel{border-color:var(--pine);background:#E6EFEC;box-shadow:inset 0 0 0 1px var(--pine)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;margin:14px 0}
.grid button{height:44px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink)}
.grid button.done{background:var(--pine);color:#fff;border-color:var(--pine)}
.grid button.cur{outline:3px solid var(--amber);outline-offset:1px}
.score{text-align:center;padding:26px 18px}
.score .big{font-size:64px;font-weight:800;color:var(--pine);line-height:1}
.score .big small{font-size:22px}
.res{border-left:5px solid var(--ok)}
.res.x{border-left-color:var(--no)}
.res .h{display:flex;gap:8px;align-items:center;font-weight:800;margin-bottom:6px}
.mark{font-size:13px;padding:2px 10px;border-radius:99px;font-weight:800}
.mark.o{background:var(--okT);color:var(--ok)}.mark.x{background:var(--noT);color:var(--no)}
.ans{font-size:15px;margin:6px 0}
.exp{background:#F6F8F6;border-radius:10px;padding:10px 12px;font-size:15px;margin-top:8px}
.ref{display:inline-block;margin-top:8px;font-size:14px;font-weight:700;color:var(--amberT);background:var(--tint);padding:3px 10px;border-radius:8px}
.banner{background:var(--tint);color:var(--amberT);border-radius:12px;padding:12px 14px;font-size:15px;margin:10px 0}
.banner.err{background:var(--noT);color:var(--no)}
.spin{width:36px;height:36px;border:4px solid #DDE5E1;border-top-color:var(--pine);border-radius:50%;animation:s 0.8s linear infinite;margin:30px auto}
@keyframes s{to{transform:rotate(360deg)}}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#E9EFEB;position:sticky;top:0}
.tbl{overflow-x:auto;max-height:420px;border:1px solid var(--line);border-radius:10px;background:#fff}
.bars{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px}
.bar{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:13px}
.bar b{display:block;font-size:18px}
.bar.low b{color:var(--no)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--pine)}
select{font-size:16px;font-family:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);width:100%;margin:8px 0;background:#fff}
.foot{text-align:center;font-size:13px;color:var(--muted);margin-top:30px}
.hidden{display:none}
</style>
</head>

<main id="app"></main>
<script>

/* ---------- 라우터 ---------- */
function route(){
  const h = location.hash.replace(/^#\/?/, '');
  const [page, id] = h.split('/');
  if (page === 'admin') return viewAdmin();
  if (!LS.get('student', null)) return viewLogin(h);
  if (page === 'q' && findQ(id)) return viewStart(findQ(id));
  if (page === 'solve' && findQ(id)) return viewSolve(findQ(id));
  if (page === 'result' && findQ(id)) return viewSavedResult(findQ(id));
  viewHome();
}
window.addEventListener('hashchange', route);

    <h1>${esc(q.title)}</h1><p class="muted">${esc(q.sub)}</p>
    <div class="card">
      <p style="margin-top:0">✔ 교재나 인터넷을 보지 말고 지금 아는 만큼 풀어주세요.<br>
      ✔ 한 문제씩 풀고, 아래 번호표로 언제든 이동할 수 있습니다.<br>
      ✔ 제출하면 바로 점수·정답·해설${q.id==='0'?'':'과 관련 강의자료 슬라이드'}를 볼 수 있습니다.<br>
      ✔ 중간에 앱을 닫아도 고른 답은 이 기기에 저장됩니다.</p>
    </div>
    <button class="btn" id="st">${saved ? '이어서 풀기' : '시작하기'}</button>`;
  document.getElementById('st').onclick = () => { location.hash = '#/solve/' + q.id; };
}

/* ---------- 문제 풀이 ---------- */
function viewSolve(q){
  header(q.title, true);
  const n = q.items.length;
  let d = LS.get('draft_' + q.id, null) || {ans: Array(n).fill(0), i: 0};
  const save = () => LS.set('draft_' + q.id, d);
  function draw(){
    const it = q.items[d.i], answered = d.ans.filter(Boolean).length;
    $app.innerHTML = `
      <div class="muted">${d.i + 1} / ${n} · 답한 문항 ${answered}개</div>
      <div class="progress"><div style="width:${answered / n * 100}%"></div></div>
      <div class="qtext">${d.i + 1}. ${esc(it.q)}</div>
      ${it.o.map((o, j) => `<button class="opt ${d.ans[d.i] === j + 1 ? 'sel' : ''}" data-j="${j + 1}"><span class="n">${CIRC[j]}</span><span>${esc(o)}</span></button>`).join('')}
      <div class="row" style="margin-top:16px">
        <button class="btn sec" id="pv" ${d.i === 0 ? 'disabled' : ''}>이전</button>
        ${d.i < n - 1 ? '<button class="btn" id="nx">다음</button>' : '<button class="btn amber" id="sb">제출하기</button>'}
      </div>
      <div class="grid">${d.ans.map((a, k) => `<button class="${a ? 'done' : ''} ${k === d.i ? 'cur' : ''}" data-k="${k}">${k + 1}</button>`).join('')}</div>
      ${d.i < n - 1 ? '<button class="btn sec" id="sb2">답안 제출하기</button>' : ''}`;
    $app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      d.ans[d.i] = Number(b.dataset.j); save();
      if (d.i < n - 1) { setTimeout(() => { d.i++; save(); draw(); window.scrollTo(0, 0); }, 180); draw(); } else draw();
    });
    $app.querySelectorAll('.grid button').forEach(b => b.onclick = () => { d.i = Number(b.dataset.k); save(); draw(); });
    const pv = document.getElementById('pv'); if (pv) pv.onclick = () => { d.i--; save(); draw(); };
    const nx = document.getElementById('nx'); if (nx) nx.onclick = () => { d.i++; save(); draw(); window.scrollTo(0, 0); };
    ['sb', 'sb2'].forEach(x => { const b = document.getElementById(x); if (b) b.onclick = submit; });
  }
  async function submit(){
    const miss = d.ans.map((a, k) => a ? null : k + 1).filter(Boolean);
    if (miss.length) { alert('아직 답하지 않은 문항이 있습니다: ' + miss.join(', ') + '번'); d.i = miss[0] - 1; save(); return draw(); }
    if (!confirm('제출할까요? 제출 후에는 점수와 해설이 바로 표시됩니다.')) return;
    if (!connected()) { alert('채점 서버가 아직 연결되지 않았습니다. 교수님이 설정을 마친 뒤 다시 제출해 주세요. (고른 답은 저장되어 있습니다)'); return; }
    const st = LS.get('student');
    $app.innerHTML = '<div class="spin"></div><p class="muted" style="text-align:center">채점 중입니다…</p>';
    try {
      const r = await fetch(window.ENDPOINT, { method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({ w: q.id, sid: st.sid, name: st.name, answers: d.ans }) });
      const res = await r.json();
      if (!res.ok) throw new Error(res.error || '제출 실패');
      const done = LS.get('done', {}); done[q.id] = { score: res.score, at: Date.now() }; LS.set('done', done);
      LS.set('res_' + q.id, { ans: d.ans, res });
      LS.del('draft_' + q.id);
      viewResult(q, d.ans, res);
    } catch (e) {
      $app.innerHTML = `<div class="banner err">제출하지 못했습니다: ${esc(e.message)}<br>인터넷 연결을 확인하고 다시 시도하세요. 고른 답은 저장되어 있습니다.</div><button class="btn" id="rt">다시 시도</button>`;
      document.getElementById('rt').onclick = () => viewSolve(q);
    }
  }
  draw();
}

/* ---------- 결과 ---------- */
function viewSavedResult(q){
  const s = LS.get('res_' + q.id, null);
  if (!s) { location.hash = '#/q/' + q.id; return; }
  viewResult(q, s.ans, s.res);
}
function viewResult(q, ans, res){
  header(q.title + ' 결과', true);
  const wrong = res.result.map((ok, i) => ok ? null : i).filter(x => x !== null);
  $app.innerHTML = `
    <div class="card score"><div class="big">${res.score}<small>점</small></div>
      <p class="muted">${res.total}문항 중 ${res.correct}문항 정답 · ${res.attempt}번째 응시</p>
      ${wrong.length ? `<p style="margin:0">틀린 문항: ${wrong.map(i => i + 1).join(', ')}번</p>` : '<p style="margin:0">모두 맞혔습니다! 👏</p>'}
    </div>
    <div class="row"><button class="btn sec" id="onlyx">틀린 문항만 보기</button><button class="btn sec" id="retry">다시 풀기</button></div>
    <h2>문항별 해설</h2>
    <div id="list"></div>
    <button class="btn" style="margin-top:18px" onclick="location.hash='#/'">목록으로</button>`;
  let only = false;
  function list(){
    document.getElementById('list').innerHTML = q.items.map((it, i) => {
      const ok = res.result[i]; if (only && ok) return '';
      return `<div class="card res ${ok ? '' : 'x'}">
        <div class="h"><span class="mark ${ok ? 'o' : 'x'}">${ok ? '정답' : '오답'}</span>${i + 1}번</div>
        <div>${esc(it.q)}</div>
        <div class="ans">내 답: ${CIRC[ans[i] - 1]} ${esc(it.o[ans[i] - 1])}${ok ? '' : `<br><b>정답: ${CIRC[res.key[i] - 1]} ${esc(it.o[res.key[i] - 1])}</b>`}</div>
        <div class="exp">${esc(res.explain[i])}</div>
        ${res.ref && res.ref[i] ? `<span class="ref">📖 ${esc(res.ref[i])}</span>` : ''}
      </div>`; }).join('');
  }
  list();
  document.getElementById('onlyx').onclick = e => { only = !only; e.target.textContent = only ? '전체 문항 보기' : '틀린 문항만 보기'; list(); };
  document.getElementById('retry').onclick = () => {
    if (confirm('다시 풀까요? 새 응시로 기록됩니다(교수님 통계는 첫 응시 기준).')) { LS.del('draft_' + q.id); location.hash = '#/solve/' + q.id; }
  };
}

/* ---------- 교수용 대시보드 (#/admin) ---------- */
async function viewAdmin(){
  header('교수용 대시보드', true);
  if (!connected()) { $app.innerHTML = '<div class="banner err">config.js에 Apps Script 웹 앱 URL이 아직 없습니다.</div>'; return; }
  const key = sessionStorage.getItem('cn3_admin') || '';
  if (!key) {
    $app.innerHTML = `<h1>교수용 대시보드</h1><div class="card"><label>비밀번호 (Code.gs의 ADMIN_PASSWORD)</label><input id="pw" type="password"><button class="btn" id="ok">확인</button></div>`;
    document.getElementById('ok').onclick = () => { sessionStorage.setItem('cn3_admin', document.getElementById('pw').value); viewAdmin(); };
    return;
  }
  $app.innerHTML = '<div class="spin"></div>';
  let data;
  try {
    const r = await fetch(window.ENDPOINT + '?action=dashboard&key=' + encodeURIComponent(key));
    const j = await r.json(); if (!j.ok) throw new Error(j.error); data = j.data;
  } catch (e) {
    sessionStorage.removeItem('cn3_admin');
    $app.innerHTML = `<div class="banner err">${esc(e.message)}</div><button class="btn" onclick="viewAdmin()">다시 입력</button>`; return;
  }
  const ids = Object.keys(data);
  $app.innerHTML = `
    <div class="row"><select id="sel">${ids.map(k => `<option value="${k}">${esc(data[k].title)} (${data[k].rows.length}건)</option>`).join('')}</select></div>
    <div id="dash"></div>
    <div class="row" style="margin-top:14px"><button class="btn sec" id="csv">CSV 내려받기</button><button class="btn sec" id="rf">새로고침</button></div>`;
  const sel = document.getElementById('sel');
  function draw(){
    const q = data[sel.value], first = q.rows.filter(r => r.attempt === 1), sc = first.map(r => r.score);
    const avg = sc.length ? (sc.reduce((a, b) => a + b, 0) / sc.length).toFixed(1) : '-';
    const rate = Array.from({length: q.n}, (_, i) => first.length ? Math.round(first.filter(r => r.ox[i] === 'O').length / first.length * 100) : null);
    document.getElementById('dash').innerHTML = `
      <div class="stats">
        <div class="stat"><b>${first.length}</b>응시</div><div class="stat"><b>${avg}</b>평균</div>
        <div class="stat"><b>${sc.length ? Math.max(...sc) : '-'}</b>최고</div><div class="stat"><b>${sc.length ? Math.min(...sc) : '-'}</b>최저</div>
      </div>
      <h2>문항별 정답률 <span class="muted">(첫 응시 기준 · 빨간색 60% 미만)</span></h2>
      <div class="bars">${rate.map((v, i) => `<div class="bar ${v !== null && v < 60 ? 'low' : ''}">Q${i + 1}<b>${v === null ? '-' : v + '%'}</b></div>`).join('')}</div>
      <h2>제출 목록 <span class="muted">(최근 순)</span></h2>
      <div class="tbl"><table><tr><th>제출시각</th><th>학번</th><th>이름</th><th>점수</th><th>차수</th><th>틀린 문항</th></tr>
      ${q.rows.slice().reverse().map(r => `<tr><td>${new Date(r.at).toLocaleString('ko-KR', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'})}</td><td>${esc(r.sid)}</td><td>${esc(r.name)}</td><td><b>${r.score}</b></td><td>${r.attempt}</td><td>${r.ox.map((x, i) => x === 'X' ? i + 1 : null).filter(Boolean).join(', ')}</td></tr>`).join('')}
      </table></div>`;
  }
  sel.onchange = draw; draw();
  document.getElementById('rf').onclick = viewAdmin;
  document.getElementById('csv').onclick = () => {
    const q = data[sel.value];
    const head = ['제출시각', '학번', '이름', '점수', '정답수', '차수'].concat(Array.from({length: q.n}, (_, i) => 'Q' + (i + 1)));
    const lines = [head].concat(q.rows.map(r => [r.at, r.sid, r.name, r.score, r.correct, r.attempt].concat(r.ox)));
    const csv = '\ufeff' + lines.map(l => l.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
    a.download = q.title + '_결과.csv'; a.click();
  };
}

route();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
